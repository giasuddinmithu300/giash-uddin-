$("#app").innerHTML=`
<div class="fbw"><button class="cover" id="cv" aria-label="${x.cvl}"><span>${x.cvp}</span></button>
<div class="wrap pr"><button class="avatar" id="av" aria-label="${x.avl}"><span class="mono" style="font-size:64px;margin:0">${L=="bn"?"মি":"M"}</span></button>

<section id="impact"><div class="wrap rv"><h2>${t.sT}</h2><p class="lead">${t.sL}</p>
<div class="grid">${t.soc.map(s=>card(s[0],`<p>${s[1]}</p>`)).join("")}</div></div></section>
<section id="media"><div class="wrap rv"><h2>${t.mT}</h2><p class="lead">${t.mL}</p>

<h3 class="sub">${x.pubT}</h3><p class="lead">${x.pubL}</p>
<div class="grid">${D.media.length?D.media.map(m=>card(m.title,`<p>${m.publication||""} ${m.date||""}</p>${m.url?`<a href="${m.url}" rel="noopener">${x.explore}</a>`:""}`)).join(""):card(x.mf[0],x.mf.slice(1).map(f=>`<p>${f}: <span class="ph">—</span></p>`).join(""))}</div></div></section>
<section id="videos"><div class="wrap rv"><h2>${x.vidT}</h2><p class="lead">${x.vidL}</p>
<div class="grid vgrid">${D.videos.length?D.videos.filter(v=>/^(https:\/\/|data:video\/)/.test(v.url)).map(v=>card(E(v.title),/^data:video\/|\.(mp4|webm|mov|m4v)(\?|$)/i.test(v.url)?`<div class="vp"><video controls playsinline preload="metadata" src="${E(v.url)}"></video></div>`:`<div class="vp" data-u="${E(v.url)}" data-r="${E(v.ratio||"16/9")}"><button type="button" class="poster" data-v style="aspect-ratio:${E(v.ratio||"16/9")}"><span>▶</span><b>${x.play}</b></button></div><p><a href="${E(v.url)}" target="_blank" rel="noopener">${x.fb}</a></p>`)).join(""):card(x.mf[0],x.mf.slice(1,2).map(f=>`<p>${f}: <span class="ph">—</span></p>`).join("")+ph(x.tbd))}</div></div></section>
<section id="orgs"><div class="wrap rv"><h2>${t.oT}</h2><p class="lead">${t.oL}</p>
<div class="chips" role="group">${x.cats.map((c,i)=>`<button class="chip" data-f="${i}" aria-pressed="${i==F}">${c}</button>`).join("")}</div>
<div class="grid" id="og"></div></div></section>
<section id="gallery"><div class="wrap rv"><h2>${t.gT}</h2><p class="lead">${t.gL}</p>
<div class="gal">${D.gallery.length?D.gallery.map((g,i)=>`<button data-g="${i}"><img src="${E(g.src)}" alt="${E(g.alt||"")}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></button>`).join(""):t.gc.map((c,i)=>`<button data-g="${i}">${c}<br><small>${t.gp}</small></button>`).join("")}</div></div></section>
<section id="recog"><div class="wrap rv"><h2>${t.rT}</h2><p class="lead">${t.rL}</p>
<div class="grid">${x.rc.map(c=>card(c,ph(x.tbd))).join("")}</div></div></section>
<section id="contact"><div class="wrap rv"><h2>${t.cT}</h2>${K.some(k=>C[k])?"":`<p class="lead">${t.cL}</p>`}
<div class="grid">${t.cf.map((f,i)=>{const k=K[i],v=C[k];return v?card(f,`<p>${k=="address"?E(v):`<a href="${k=="phone"?"tel:"+E(v):k=="email"?"mailto:"+E(v):/^https:\/\//.test(v)?E(v):"#"}" rel="noopener">${E(v)}</a>`}</p>`):""}).join("")}</div></div></section>`;
$("#foot").textContent=t.ft;
$("#ov").onclick=()=>{$("#dbody").innerHTML=`<h2>${t.name}</h2><p class="role">${t.role}</p><ul>${t.dl.map(x=>`<li>${x}</li>`).join("")}</ul>`;$("#dlg").showModal()};
const og=()=>{$("#og").innerHTML=D.orgs.filter(o=>!F||o[2]==F).map(o=>card(o[L=="bn"?0:1],o[3]?`<p>${x.cats[o[2]]}</p><p><b>${o[L=="bn"?3:4]}</b></p><p>${o[L=="bn"?5:6]}</p>`:`<p>${x.cats[o[2]]}</p>${ph(t.assoc)}`)).join("")};og();
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=+b.dataset.f;document.querySelectorAll("[data-f]").forEach(c=>c.setAttribute("aria-pressed",c===b));og()});
const gl=D.gallery,gn=gl.length||t.gc.length;
const gs=n=>{G=(n+gn)%gn;$("#dbody").innerHTML=(gl.length?`<img src="${E(gl[G].src)}" alt="${E(gl[G].alt||"")}" style="max-width:100%"><p>${E(gl[G].alt||"")}</p>`:`<h2>${t.gc[G]}</h2>${ph(t.gp)}`)+`<p><button class="btn" id="gp">${x.prev}</button><button class="btn" id="gn">${x.next}</button></p>`;$("#gp").onclick=()=>gs(G-1);$("#gn").onclick=()=>gs(G+1);if(!$("#dlg").open)$("#dlg").showModal()};
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>gs(+b.dataset.g));
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{$("#dbody").innerHTML=`<h2>${b.parentNode.querySelector("h3").textContent}</h2><p>${x.role}</p>${ph(x.tbd)}`;$("#dlg").showModal()});
$("#dx").textContent=x.close;$("#mb").setAttribute("aria-label",x.menu);
document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>{$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false")});
clearInterval(window._rt);const ws=t.role.split(" • "),rw=$("#rw");let wi=0;rw.textContent=ws[0];
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)window._rt=setInterval(()=>{rw.classList.add("o");setTimeout(()=>{wi=(wi+1)%ws.length;rw.textContent=ws[wi];rw.classList.remove("o")},400)},2600);
$("#sr").setAttribute("aria-label",x.sr);$("#sh").setAttribute("aria-label",x.sh);$("#si").placeholder=x.sp;$("#sx").textContent=x.close;
window._idx=[...t.nav.map((n,i)=>[n,"#"+ids[i]]),...t.steps.map(n=>[n,"#journey"]),...D.orgs.map(o=>[o[L=="bn"?0:1],"#orgs"]),...t.soc.map(s=>[s[0],"#impact"]),...x.rc.map(n=>[n,"#recog"]),...t.cf.map(n=>[n,"#contact"])];
const sp=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("act",a.getAttribute("href")==="#"+(e.target.id==="recog"?"gallery":e.target.id)))}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("section[id]").forEach(e=>sp.observe(e));
const big=h=>{$("#dbody").innerHTML=h;$("#dlg").classList.add("big");$("#dlg").showModal()};
if(IMG.cover){$("#cv").style.backgroundImage=`url("${E(IMG.cover)}")`;$("#cv span").remove()}
if(IMG.portrait)$("#av").innerHTML=`<img src="${E(IMG.portrait)}" alt="${t.name}">`;
$("#cv").onclick=()=>big(IMG.cover?`<img src="${E(IMG.cover)}" alt="">`:`<p class="ph">${x.cvp}</p>`);
$("#av").onclick=()=>big(IMG.portrait?`<img src="${E(IMG.portrait)}" alt="${t.name}">`:`<p class="ph">${x.photo||t.photo}</p>`);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));}
$("#lang").onclick=()=>{L=L==="bn"?"en":"bn";try{localStorage.setItem("l",L)}catch(e){}render()};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("#mb").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
$("#dlg").addEventListener("close",()=>$("#dlg").classList.remove("big"));
document.addEventListener("click",e=>{if(e.target.closest("[data-off]"))toast(X[L].tbd)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;const p=b.parentNode,u=p.dataset.u;let src="";try{const w=new URL(u),h=w.hostname;if(/(^|\.)facebook\.com$/.test(h))src="https://www.facebook.com/plugins/video.php?show_text=false&href="+encodeURIComponent(u);else if(/(^|\.)youtube\.com$/.test(h)){const id=w.searchParams.get("v");if(id)src="https://www.youtube.com/embed/"+encodeURIComponent(id)}else if(h==="youtu.be")src="https://www.youtube.com/embed/"+encodeURIComponent(w.pathname.slice(1))}catch(_){}if(!src)return;const R=(p.dataset.r||"16/9").split("/").map(Number);p.innerHTML=`<iframe src="${src}" title="Video" allowfullscreen loading="lazy" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" style="width:min(100%,${(78*R[0]/R[1]).toFixed(1)}vh);aspect-ratio:${R[0]}/${R[1]};margin:0 auto;border:0"></iframe>`});
document.addEventListener("securitypolicyviolation",e=>{if(!/facebook\.com|youtube\.com/.test(e.blockedURI))return;document.querySelectorAll(".vp iframe").forEach(f=>{const p=f.parentNode;p.innerHTML=`<a class="poster" style="aspect-ratio:${p.dataset.r||"16/9"}" href="${p.dataset.u}" target="_blank" rel="noopener"><span>▶</span><b>${X[L].watch}</b></a>`})});
$("#dx").onclick=()=>$("#dlg").close();

const kb=[[["তিনি কে","পরিচয়","who is","who are"],()=>`${t.name}. ${t.intro}`],
[["role","পদ","president","সভাপতি","founder","প্রতিষ্ঠাতা","chairman","চেয়ারম্যান","director","পরিচালক","leader","নেতৃত্ব"],()=>D.orgs.filter(o=>o[3]).map(o=>`• ${o[L=="bn"?0:1]} — ${o[L=="bn"?3:4]} (${o[L=="bn"?5:6]})`).join("\n")],

[["youth","যুব","education","শিক্ষা","skill"],()=>t.soc.slice(0,2).map(s=>`• ${s[0]}: ${s[1]}`).join("\n")+"\n"+I],
[["blood","রক্ত","social","সমাজ","community"],()=>`${t.soc[3][0]}: ${t.soc[3][1]}`],
[["club","ক্লাব","organi","সংগঠন","affiliat"],()=>D.orgs.filter(o=>o[2]>1).map(o=>"• "+o[L=="bn"?0:1]).join("\n")],
[["contact","যোগাযোগ","phone","email","ফোন","ইমেইল"],()=>K.filter(k=>C[k]).map(k=>`${k}: ${C[k]}`).join("\n")||t.cL],
[["award","পুরস্কার","recognition","স্বীকৃতি","অর্জন"],()=>t.rL]];
addM(q,1);const h=kb.find(e=>e[0].some(k=>ql.includes(k)));addM(h?h[1]():x.aiNo,0)};

addEventListener("scroll",()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;$("#pg").style.width=(m>0?scrollY/m*100:0)+"%";$("#tt").classList.toggle("s",scrollY>700)},{passive:true});
